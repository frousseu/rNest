# Species groupings offered in the rNest interface.
#
# For each attribute:
# - columns: the columns of the birdgroupings dataset it is read from;
# - values: the values matched in those columns;
# - labels: the names the interface shows for those values, in the same order.
#
# Strings are quoted: unquoted Yes/No would be read as booleans.

bird_status:
  columns: ["MBCA_2011_Final"]
  values:
    - "Yes"
    - "No"
  labels:
    - "federal"
    - "provincial"

bird_type:
  columns: ["Species_gr1"]
  values:
    - "Landbirds"
    - "Waterbirds"
    - "Waterfowl"
    - "Shorebirds"
  labels:
    - "landbirds"
    - "waterbirds"
    - "waterfowl"
    - "shorebirds"

habitat_type:
  columns: ["Habitat1", "Habitat2", "Habitat3"]
  values:
    - "tf"
    - "to"
    - "we"
  labels:
    - "forest"
    - "open"
    - "wetland"

nest_location:
  columns: ["Nest_Type1", "Nest_Type2", "Nest_Type3"]
  values:
    - "gro"
    - "wat"
    - "bot"
    - "cav"
    - "man"
    - "cli"
    - "col"
  labels:
    - "ground"
    - "water"
    - "vegetation"
    - "cavity"
    - "man-made"
    - "cliff"
    - "colony"

model_output:
  columns: ["model"]
  values:
    - 1
    - 0
  labels:
    - "accepted"
    - "rejected"

